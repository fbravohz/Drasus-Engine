[package]
name = "session-catalog"
description = "Catálogo de plantillas de calendario de mercado compartidas (forma de mercado, no bróker ni símbolo). Crate hexagonal de dominio (ADR-0137). EPIC-1 / Ingest, ADR-0162, STORY-066."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# ÚNICA dependencia interna permitida para un feature crate (ADR-0137).
# Prohibido depender de otros feature crates o presets.
shared = { path = "../../../shared" }

# Runtime asíncrono: la persistencia (SQLite) es async, igual que el resto
# del substrato.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# Generación de UUIDs. v7 (ordenable por tiempo, ADR-0141 "Claves primarias")
# es el generador canónico del sistema.
uuid = { version = "1", features = ["v4", "v7"] }
# Hash SHA-256 para los campos de integridad (audit_hash, audit_chain_hash).
sha2 = "0.10"
# Serialización/deserialización para el input/output del harness de
# verificación CLI (ADR-0142).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Acceso a SQLite para la persistencia del catálogo. El feature crate no
# crea su propio pool -- usa el de shared.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
# Mensajes de error propios de la cáscara.
thiserror = "1"

[dev-dependencies]
# Directorios/archivos temporales con limpieza automática para tests de
# integración (durabilidad -- SQLite en archivo real, nunca `:memory:`).
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
